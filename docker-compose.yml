services:
  postgres:
    image: postgres:17-alpine
    container_name: meetsnaply-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: meetsnaply
      POSTGRES_PASSWORD: meetsnaply
      POSTGRES_DB: meetsnaply
    ports:
      - "5433:5432"
    volumes:
      - meetsnaply-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetsnaply -d meetsnaply"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meetsnaply-pgdata:
